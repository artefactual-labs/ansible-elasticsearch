---
# Elasticsearch Ansible Variables

# Set as True to remove ES rpm repos and download the rpm directly
# Usefull when your IP address is banned from https://artifacts.elastic.co
# See: https://discuss.elastic.co/t/are-you-getting-403s-when-downloading-please-read-here-first/307340?page=4
# When using elasticsearch_yum_no_repo=True you need to use elasticsearch_download_url variable
elasticsearch_yum_no_repo: False

elasticsearch_user: elasticsearch
elasticsearch_group: elasticsearch
# Alternave download URL: https://packages.archivematica.org/elasticsearch/
elasticsearch_download_url: https://artifacts.elastic.co/downloads/elasticsearch
elasticsearch_version_5: "5.6.16"
elasticsearch_version_6: "6.8.21"
elasticsearch_version_7: "7.10.2"  # Final 7.x Elasticsearch version under an OSI-approved open source license.
elasticsearch_version_8: "8.18.3"
elasticsearch_apt_repos: []
elasticsearch_java_packages:
  '5':
    debian: "openjdk-8-jre-headless"
    redhat: "java-1.8.0-openjdk"
    java_home: "/usr/lib/jvm/java-1.8.0-openjdk-amd64"
  '6':
    debian: "openjdk-8-jre-headless"
    redhat: "java-1.8.0-openjdk"
    java_home: "/usr/lib/jvm/java-1.8.0-openjdk-amd64"
  '7':
    debian: "openjdk-11-jre-headless"
    redhat: "java-11-openjdk-headless"
    java_home: "/usr/lib/jvm/java-11-openjdk-amd64"
  '8':
    debian: "openjdk-17-jre-headless"
    redhat: "java-17-openjdk-headless"
    java_home: "/usr/lib/jvm/java-17-openjdk-amd64"

elasticsearch_version: "{{ elasticsearch_version_6 }}"
elasticsearch_apt_java_package: "{{ elasticsearch_java_packages['6']['debian'] }}"
elasticsearch_yum_java_package: "{{ elasticsearch_java_packages['6']['redhat'] }}"
elasticsearch_java_home: "{{ elasticsearch_java_packages['6']['java_home'] }}"

elasticsearch_apt_dependencies:
  - htop
  - ntp
  - unzip
elasticsearch_max_open_files: 65535
elasticsearch_home_dir: /usr/share/elasticsearch
elasticsearch_plugin_dir: /usr/share/elasticsearch/plugins
elasticsearch_log_dir: /var/log/elasticsearch
elasticsearch_data_dir: /var/lib/elasticsearch
elasticsearch_work_dir: /tmp/elasticsearch
elasticsearch_conf_dir: /etc/elasticsearch
elasticsearch_service_startonboot: yes
#elasticsearch_http_cors_enabled: "false"
elasticsearch_service_state: started
elasticsearch_network_bind_host: "127.0.0.1"


# Elasticsearch 1.7 Ansible Variables

elasticsearch17_download_url: https://download.elasticsearch.org/elasticsearch/elasticsearch

# Elasticsearch 6.x Ansible Variables

elasticsearch_heap_size: "1g"
elasticsearch_timezone: "UTC"
elasticsearch_node_max_local_storage_nodes: "1"
elasticsearch_memory_bootstrap_mlockall: "true"
elasticsearch_install_java: "true"
elasticsearch_network_http_max_content_lengtht: 1024mb
elasticsearch_discovery_zen_ping_multicast_enabled: "false"
elasticsearch_max_locked_memory: "unlimited"
elasticsearch_network_host: "127.0.0.1"
elasticsearch_network_bind: "127.0.0.1"


# Non-Elasticsearch Defaults
apt_cache_valid_time: 300 # seconds between "apt-get update" calls.
install_rpm_repositories: "true"

# Elasticsearch 7.x/8.x Ansible Variables

# Security Settings (ES 8.x) - disabled by default for compatibility
elasticsearch_xpack_security_enabled: false
elasticsearch_xpack_security_enrollment_enabled: false
elasticsearch_xpack_security_http_ssl_enabled: false
elasticsearch_xpack_security_transport_ssl_enabled: false

# Additional Settings
elasticsearch_action_destructive_requires_name: true
elasticsearch_ingest_geoip_downloader_enabled: false

# X-Pack Features
elasticsearch_xpack_monitoring_enabled: false
elasticsearch_xpack_monitoring_collection_enabled: false
elasticsearch_xpack_ml_enabled: false
elasticsearch_xpack_watcher_enabled: false
elasticsearch_xpack_license_self_generated_type: "basic"

# HTTP Settings
elasticsearch_http_cors_enabled: false

# Cluster Routing Settings
elasticsearch_cluster_routing_allocation_disk_threshold_enabled: true
elasticsearch_cluster_routing_allocation_disk_watermark_low: "85%"
elasticsearch_cluster_routing_allocation_disk_watermark_high: "90%"
elasticsearch_cluster_routing_allocation_disk_watermark_flood_stage: "95%"
